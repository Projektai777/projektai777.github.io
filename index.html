<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2937" id="themeColor">
  <title>Lojalumo kortelė</title>
  <link rel="manifest" href="./manifest.webmanifest" id="manifest">
  <link rel="stylesheet" href="./styles.css">
  <link rel="apple-touch-icon" href="./icon-192.png" id="appleIcon">
  <!-- Capture the install prompt AS EARLY AS POSSIBLE: Chrome can fire
       beforeinstallprompt before the module script finishes loading, and a
       missed event means no one-tap install. app.js reads window.__bip. -->
  <script>
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__bip = e; });
    window.addEventListener('appinstalled', function () { window.__bip = null; });
  </script>
</head>
<body>
  <main id="app">
    <div class="loading">Kraunama…</div>
  </main>

  <!-- Celebration: shown when the card is completed -->
  <dialog id="celebrateModal" class="celebrate">
    <div class="celebrate-emoji">🎉</div>
    <h2>Sveikiname!</h2>
    <p id="celebrateText"></p>
    <button class="cta" id="celebrateClose">Puiku!</button>
  </dialog>

  <!-- Scan modal: the CUSTOMER scans the rotating staff QR with their OWN camera (no typing) -->
  <dialog id="scanModal">
    <h2 id="scanTitle">Nuskaitykite darbuotojo QR</h2>
    <p class="scan-hint">Nukreipkite kamerą į darbuotojo QR kodą.</p>
    <div class="scan-frame"><video id="scanVideo" playsinline muted></video></div>
    <p class="scan-fallback" id="scanFallback" hidden></p>
    <button class="scan-cancel" id="scanCancel">Atšaukti</button>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>
